name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64-gnu
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            use_cross: false
          - name: linux-x86_64-musl
            os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            use_cross: true
          - name: linux-aarch64-musl
            os: ubuntu-22.04
            target: aarch64-unknown-linux-musl
            use_cross: true
          - name: darwin-aarch64
            os: macos-14
            target: aarch64-apple-darwin
            use_cross: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}
          key: ${{ hashFiles('Cargo.lock') }}

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --locked --version 0.2.5

      - name: Build (cargo)
        if: ${{ !matrix.use_cross }}
        run: cargo build --release --target ${{ matrix.target }} -p manifestvault-engine --bin manifestvault

      - name: Build (cross)
        if: matrix.use_cross
        run: cross build --release --target ${{ matrix.target }} -p manifestvault-engine --bin manifestvault

      - name: Strip binary (unix)
        if: runner.os == 'Linux' && !matrix.use_cross
        run: strip target/${{ matrix.target }}/release/manifestvault || true

      - name: Strip binary (macos)
        if: runner.os == 'macOS'
        run: strip target/${{ matrix.target }}/release/manifestvault || true

      - name: Package tarball
        id: package
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          ARTIFACT="manifestvault-${TAG}-${{ matrix.name }}"
          STAGE="$(mktemp -d)/${ARTIFACT}"
          mkdir -p "${STAGE}"
          cp "target/${{ matrix.target }}/release/manifestvault" "${STAGE}/"
          cp README.md "${STAGE}/" || true
          tar -C "$(dirname "${STAGE}")" -czf "${ARTIFACT}.tar.gz" "${ARTIFACT}"
          sha256sum "${ARTIFACT}.tar.gz" > "${ARTIFACT}.sha256"
          echo "artifact=${ARTIFACT}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact }}
          path: |
            ${{ steps.package.outputs.artifact }}.tar.gz
            ${{ steps.package.outputs.artifact }}.sha256

  release:
    name: draft github release
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          rm -f SHA256SUMS
          sha256sum *.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
