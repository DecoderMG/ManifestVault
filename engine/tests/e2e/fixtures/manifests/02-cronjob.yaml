apiVersion: batch/v1
kind: CronJob
metadata:
  name: nightly-index
  namespace: platform
spec:
  schedule: "0 2 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: indexer
              image: debian:bookworm-slim
              securityContext:
                runAsNonRoot: true
                runAsUser: 1000
